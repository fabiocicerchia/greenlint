[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "greenlint"
version = "0.9.0"
description = "Static analysis flagging energy-wasteful patterns across languages"
readme = "README.md"
license = { text = "Apache-2.0" }
authors = [{ name = "Fabio Cicerchia" }]
# 3.11 for `tomllib`. The alternative was a `tomli` dependency on 3.10 alone,
# which the repo's dependency-free guardrail rules out; 3.10 reaches EOL in
# October 2026 and greenlint is pre-1.0.
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4", "build>=1.2"]

[project.urls]
Homepage = "https://github.com/fabiocicerchia/greenlint"
Issues = "https://github.com/fabiocicerchia/greenlint/issues"
Changelog = "https://github.com/fabiocicerchia/greenlint/blob/main/CHANGELOG.md"

[project.scripts]
greenlint = "greenlint:main"

[tool.setuptools]
py-modules = ["greenlint"]

[tool.pytest.ini_options]
# `import greenlint` from tests/ finds whatever is installed before it finds the
# checkout — an editable install points at another clone, a wheel at
# site-packages — so the suite silently graded a different tree. The repo root
# goes first on sys.path so `pytest` tests the files you just edited.
pythonpath = ["."]

[tool.ruff]
line-length = 120
# examples/ holds deliberately wasteful sample code for greenlint to flag.
extend-exclude = ["examples"]

[tool.ruff.lint]
select = [
  "E", "W", "F", "I", "N", "UP", "ANN", "ASYNC", "S", "B", "A", "C4", "DTZ",
  "T20", "PT", "RET", "SIM", "PTH", "ERA", "TD", "FIX", "PLR2004", "TRY", "PL", "RUF",
]
ignore = [
  "ANN401",      # Any in *args/**kwargs — FC-GEN-016's comment rule covers it
  "TRY003",      # long messages inline; FC-GEN-022 wants them descriptive
]

[tool.ruff.lint.flake8-annotations]
mypy-init-return = true

[tool.ruff.lint.per-file-ignores]
# `assert` is what a test is, and an expected value is the literal it compares
# against -- naming it moves the assertion one step from the thing asserted.
"tests/**" = [
  "S101",     # `assert` is what a test is
  "PLR2004",  # an expected value is the literal it compares against
  "ANN001",   # a fixture or a fake's argument, named by the test that builds it
  "ANN002",   # a fake's *args exist to swallow whatever the real call passes
  "ANN003",   # ditto **kwargs
  "ANN201",   # a test helper's return is whatever the assertions read
  "ANN202",
  "PLC0415",  # a test that imports inside itself is controlling import order,
              # which is the thing under test in the module-loading cases
  "T201",     # a test that prints is reporting its own measurement
  "S603",     # a test that launches the language server is launching it
]
