<!-- Panel icon. Monochrome and drawn with currentColor: VS Code tints view
     container icons itself, and a coloured icon fights every theme it lands in.
     Same mark as media/icon.png — a leaf with the bolt taken out of it, because
     the subject is the energy the code wastes, not the foliage. -->
