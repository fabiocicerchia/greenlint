# Backstage catalog entry, read by paved's scorecard plugin.
#
# Every check paved scores is derived from this file alone — no cluster
# access, no CI credentials. What is absent here is absent from the score.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: greenlint
  description: >-
      Static linter for carbon-inefficient patterns in code and CI — flags unnecessary compute, oversized
      containers, missing cache directives, and more.
  annotations:
    github.com/project-slug: fabiocicerchia/greenlint
    backstage.io/source-location: url:https://github.com/fabiocicerchia/greenlint/
    backstage.io/techdocs-ref: dir:.
  links:
    - url: https://github.com/fabiocicerchia/greenlint
      title: Source
spec:
  type: library
  lifecycle: production
  owner: group:default/kodebeat
  system: oss-tools
