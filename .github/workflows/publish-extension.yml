name: publish-extension

# Publishes the VS Code extension when a GitHub Release is published — which is
# what merging release-please's PR does. The version comes from the tag, so the
# extension and the linter ship as one version and there is no second number to
# keep in step. That matters more here than it looks: the extension drives
# `greenlint.py` and needs a greenlint new enough to have the scan API, so "the
# extension and the CLI are the same version" is a claim worth being true by
# construction.
#
# Nothing happens without the tokens: each publish step is skipped when its
# secret is missing, so this file is inert until VSCE_PAT (VS Marketplace) and
# OVSX_PAT (Open VSX) are set in the repository's secrets. Marketplace versions
# are immutable — a version published once can never be replaced, only
# superseded — so the version check below is deliberately strict.

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Version to publish, without the leading v (e.g. 0.1.6)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: write  # attach the VSIX to the release
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: editors/vscode/package-lock.json

      - name: Resolve the version
        id: version
        env:
          TAG: ${{ github.event.release.tag_name }}
          INPUT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          VERSION="${INPUT:-${TAG#v}}"
          # The Marketplace takes x.y.z and nothing else, and refuses a version
          # it has seen before — better to fail here than half way through.
          if ! printf '%s' "$VERSION" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::'$VERSION' is not a publishable version (want x.y.z)"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          # release-please already writes this version into the manifest (see
          # release-please-config.json), so this is normally a no-op. It stays
          # for workflow_dispatch, and so that a mismatch can never ship.
          node -e '
            const fs = require("node:fs")
            const path = "editors/vscode/package.json"
            const pkg = JSON.parse(fs.readFileSync(path, "utf8"))
            pkg.version = process.argv[1]
            fs.writeFileSync(path, `${JSON.stringify(pkg, null, 2)}\n`)
          ' "$VERSION"
          echo "publishing greenlint $VERSION"

      - name: Install
        run: npm --prefix editors/vscode ci

      - name: Test
        run: npm --prefix editors/vscode test

      # `vscode:prepublish` typechecks, bundles and copies the licence and the
      # changelog in, so the VSIX built here is the one the publish steps upload.
      - name: Package
        working-directory: editors/vscode
        run: npx --yes @vscode/vsce@3.9.2 package --no-dependencies

      # `secrets` cannot be read from a job-level `if`, so which registries are
      # reachable is decided here and read back as step outputs.
      - name: Which registries are configured
        id: tokens
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
        run: |
          {
            echo "marketplace=$([ -n "$VSCE_PAT" ] && echo true || echo false)"
            echo "openvsx=$([ -n "$OVSX_PAT" ] && echo true || echo false)"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to the VS Marketplace
        if: steps.tokens.outputs.marketplace == 'true'
        working-directory: editors/vscode
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
          VSIX: greenlint-${{ steps.version.outputs.version }}.vsix
        run: npx --yes @vscode/vsce@3.9.2 publish --no-dependencies --packagePath "$VSIX"

      # Where VSCodium and Cursor look. A separate registry with its own
      # namespace and token, not a mirror of the Marketplace.
      - name: Publish to Open VSX
        if: steps.tokens.outputs.openvsx == 'true'
        working-directory: editors/vscode
        env:
          OVSX_PAT: ${{ secrets.OVSX_PAT }}
          VSIX: greenlint-${{ steps.version.outputs.version }}.vsix
        run: npx --yes ovsx@1.1.1 publish "$VSIX" -p "$OVSX_PAT"

      - name: Attach the VSIX to the release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
          VSIX: editors/vscode/greenlint-${{ steps.version.outputs.version }}.vsix
        run: gh release upload "$TAG" "$VSIX" --clobber

      # A run that publishes nowhere still has to say so, or "green" and
      # "published" become the same colour.
      - name: Say what happened
        env:
          VERSION: ${{ steps.version.outputs.version }}
          MARKETPLACE: ${{ steps.tokens.outputs.marketplace }}
          OPENVSX: ${{ steps.tokens.outputs.openvsx }}
        run: |
          say() { [ "$1" = true ] && echo published || echo "skipped (no $2)"; }
          {
            echo "### greenlint $VERSION"
            echo "- VS Marketplace: $(say "$MARKETPLACE" VSCE_PAT)"
            echo "- Open VSX: $(say "$OPENVSX" OVSX_PAT)"
          } >> "$GITHUB_STEP_SUMMARY"
