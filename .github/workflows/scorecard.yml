name: scorecard

# OpenSSF Scorecard: rates the repo's security posture (branch protection,
# pinned deps, token permissions, etc.) and uploads results to the Security tab.
# Public repos: results also appear at deps.dev / the Scorecard badge.

on:
  branch_protection_rule:
  schedule:
    - cron: "0 6 * * 1"  # weekly
  push:
    branches: [main]

permissions: read-all

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      security-events: write  # upload SARIF
      id-token: write  # publish results (public repos)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@62b2cac7ed8198b15735ed49ab1e5cf35480ba46  # v2.4.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: github/codeql-action/upload-sarif@4187e74d05793876e9989daffde9c3e66b4acd07  # v3
        with:
          sarif_file: results.sarif
