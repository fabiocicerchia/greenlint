name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Lint / formatting / secret scanning live in code-quality.yml and
# security.yml. This workflow runs the Python test matrix and the build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev dependencies
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Pytest
        run: pytest -q

  # The extension is TypeScript in a Python repo: without a compile in CI, a
  # type error in it is invisible until someone opens the editor. No setup-node
  # step — the runner image already ships a Node new enough for tsc, and this
  # way the job adds no third-party action to pin.
  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: editors/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - name: Install from the lockfile
        run: npm ci
      - name: Typecheck and compile
        run: npm run compile
      - name: Test
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install --require-hashes -r requirements-release.txt
          python -m build
      - name: Check metadata
        run: twine check dist/*  # installed from the hashed lock above
