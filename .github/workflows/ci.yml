name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Lint / formatting / secret scanning live in code-quality.yml and
# security.yml. This workflow runs the Python test matrix and the build.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install package with dev dependencies
        run: |
          pip install --require-hashes -r requirements-dev.txt
          pip install -e . --no-deps
      - name: Pytest
        run: pytest -q

      # FC-PY-003. Runs here rather than in pre-commit because a type checker
      # with no dependencies installed reports every import as unresolved and
      # every value that came through one as unknown -- noise that says nothing
      # about this code. Once per matrix and not three times: the config pins
      # the target version, so the other legs would only repeat the answer.
      - name: Basedpyright
        if: matrix.python-version == '3.11'
        run: basedpyright

  # The extension is TypeScript in a Python repo: without a compile in CI, a
  # type error in it is invisible until someone opens the editor. Node is
  # pinned rather than taken from the runner image, so a change to that image
  # cannot quietly move what this is built and tested against — the same pin
  # the sibling depwatch repo uses.
  vscode-extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extensions/vscode
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: extensions/vscode/package-lock.json
      - name: Install from the lockfile
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Build
        run: npm run build
      - name: Test
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: "3.12"
      - name: Build sdist and wheel
        run: |
          pip install --require-hashes -r requirements-release.txt
          python -m build
      - name: Check metadata
        run: twine check dist/*  # installed from the hashed lock above
